# What a reagent's chart renders when its values ask for backups. Everything below the
# name is optional: an empty spec takes the controller's defaults.
apiVersion: backups.helmetica.io/v1
kind: BackupPolicy
metadata:
  name: orders
  namespace: default
spec:
  schedule:
    backup: "0 2 * * *"
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
---
# A service whose own operator writes backups to S3: ampulla provisions the bucket and the
# credentials and leaves the backing up to the service.
apiVersion: backups.helmetica.io/v1
kind: BackupPolicy
metadata:
  name: ledger
  namespace: default
spec:
  mode: BucketOnly
