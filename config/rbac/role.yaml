---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resourceNames:
  - instance-admin
  resources:
  - serviceaccounts
  verbs:
  - impersonate
- apiGroups:
  - ampulla.helmetica.io
  resources:
  - backuppolicies
  - backuptemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ampulla.helmetica.io
  resources:
  - backuppolicies/status
  - backuptemplates/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - k8up.io
  resources:
  - schedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketaccesses
  - bucketclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
